name: CI & Release

on:
  workflow_dispatch:
  push:
    branches: [main, prerelease-next]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24.14.1"
  BUN_VERSION: "1.3.14"
  N_VERSION: "10.2.0"
  NPM_VERSION: "11.5.1"
  SOPS_SHA256: "775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef"
  AGE_SHA256: "2ae71cb3ea761118937a944083f057cfd42f0ef11d197ce72fc2b8780d50c4ef"
  NPM_REGISTRY_URL: "https://npm.ch5.me/"
  NPM_REGISTRY_HOST: "npm.ch5.me"

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Forbid bare `npx hush` in docs
        run: |
          # Bare `npx hush` resolves to an unrelated squatted npm package.
          # Docs must always use the scoped form: npx @chriscode/hush
          if grep -rn 'npx hush[^-@]' README.md docs/src --include='*.md' --include='*.mdx'; then
            echo 'Found bare `npx hush` usage above. Use `npx @chriscode/hush` instead.'
            exit 1
          fi
          echo 'OK: no bare `npx hush` usage.'

      - name: Setup Bun (docs build preview)
        if: forgejo.event_name == 'pull_request'
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $FORGEJO_PATH

      - name: Install dependencies (docs build preview)
        if: forgejo.event_name == 'pull_request'
        run: bun install --frozen-lockfile

      - name: Build docs (PR preview verify)
        if: forgejo.event_name == 'pull_request'
        run: bun run docs:build

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node 24
        run: |
          npm install -g "n@${N_VERSION}"
          n "${NODE_VERSION}"
          echo "/usr/local/bin" >> $FORGEJO_PATH

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $FORGEJO_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run cli:build

      - name: Smoke test --version
        run: node hush-cli/bin/hush.js --version

      - name: Smoke test --help
        run: node hush-cli/bin/hush.js --help

  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # Full history for version calculation

      - name: Install Node 24
        run: |
          npm install -g "n@${N_VERSION}"
          n "${NODE_VERSION}"
          echo "/usr/local/bin" >> $FORGEJO_PATH

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $FORGEJO_PATH

      - name: Install sops and age
        run: |
          run_root() {
            if command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              "$@"
            fi
          }

          curl -LO https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64
          echo "$SOPS_SHA256  sops-v3.11.0.linux.amd64" | sha256sum -c -
          run_root mv sops-v3.11.0.linux.amd64 /usr/local/bin/sops
          run_root chmod +x /usr/local/bin/sops

          curl -LO https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz
          echo "$AGE_SHA256  age-v1.2.0-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf age-v1.2.0-linux-amd64.tar.gz
          run_root mv age/age /usr/local/bin/
          run_root mv age/age-keygen /usr/local/bin/
          run_root chmod +x /usr/local/bin/age /usr/local/bin/age-keygen

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies for vulnerabilities
        run: bun audit

      - name: Build CLI
        run: bun run cli:build

      - name: Type check
        run: bun run type-check

      - name: Run tests
        run: bun run cli:test

  release:
    needs: [docs-lint, cli-smoke, ci]
    # workflow_dispatch is included deliberately: a release that fails for an
    # environmental reason (an unset Actions secret, a registry blip) previously had
    # NO retry path, because this job ran on push only. The fix then had to ride on
    # an unrelated commit, or wait for one. Manual re-run is the recovery path.
    if: (forgejo.ref == 'refs/heads/main' || forgejo.ref == 'refs/heads/prerelease-next') && (forgejo.event_name == 'push' || forgejo.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      released: ${{ steps.version.outputs.should_release == 'true' && steps.check_published.outputs.already_published == 'false' && steps.npm_auth.outputs.can_publish == 'true' && 'true' || 'false' }}
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ forgejo.token }}

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $FORGEJO_PATH

      - name: Install Node 24
        run: |
          npm install -g "n@${N_VERSION}"
          n "${NODE_VERSION}"
          echo "/usr/local/bin" >> $FORGEJO_PATH

      - name: Install sops and age
        run: |
          run_root() {
            if command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              "$@"
            fi
          }

          curl -LO https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64
          echo "$SOPS_SHA256  sops-v3.11.0.linux.amd64" | sha256sum -c -
          run_root mv sops-v3.11.0.linux.amd64 /usr/local/bin/sops
          run_root chmod +x /usr/local/bin/sops

          curl -LO https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz
          echo "$AGE_SHA256  age-v1.2.0-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf age-v1.2.0-linux-amd64.tar.gz
          run_root mv age/age /usr/local/bin/
          run_root mv age/age-keygen /usr/local/bin/
          run_root chmod +x /usr/local/bin/age /usr/local/bin/age-keygen

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify packaged CLI entrypoint
        run: bun run --filter @chriscode/hush verify:pack-install

      - name: Calculate version bump
        id: version
        run: |
          RELEASE_CHANNEL="latest"
          IS_PRERELEASE="false"
          if [ "${{ forgejo.ref }}" = "refs/heads/prerelease-next" ]; then
            RELEASE_CHANNEL="next"
            IS_PRERELEASE="true"
          fi
          RELEASE_BRANCH="${FORGEJO_REF#refs/heads/}"

          echo "release_channel=$RELEASE_CHANNEL" >> $FORGEJO_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $FORGEJO_OUTPUT
          echo "release_branch=$RELEASE_BRANCH" >> $FORGEJO_OUTPUT

          # Get current package version from CH5 Verdaccio.
          CURRENT_NPM_VERSION=$(npx -y "npm@${NPM_VERSION}" view "@chriscode/hush@${RELEASE_CHANNEL}" version --registry="${NPM_REGISTRY_URL}" 2>/dev/null || echo "0.0.0")
          echo "current_npm_version=$CURRENT_NPM_VERSION" >> $FORGEJO_OUTPUT

          # Get current package.json version
          PACKAGE_VERSION=$(node -p "require('./hush-cli/package.json').version")
          echo "package_version=$PACKAGE_VERSION" >> $FORGEJO_OUTPUT

          # Find the tag for the current npm version
          LAST_TAG="v$CURRENT_NPM_VERSION"

          # Check if tag exists, if not use all commits
          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" 2>/dev/null || echo "")
          else
            echo "No previous tag found, analyzing recent commits"
            COMMITS=$(git log --pretty=format:"%s" -50)
          fi

          echo "Commits since $LAST_TAG:"
          echo "$COMMITS"

          # Determine bump type from conventional commits
          BUMP="none"

          if echo "$COMMITS" | grep -qE "^[a-z]+(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qE "^(fix|docs|refactor|test|chore|style|ci|build)(\(.+\))?:"; then
            BUMP="patch"
          fi

          echo "bump=$BUMP" >> $FORGEJO_OUTPUT

          if [ "$BUMP" = "none" ]; then
            echo "No conventional commits found, skipping release"
            echo "new_version=$CURRENT_NPM_VERSION" >> $FORGEJO_OUTPUT
            echo "should_release=false" >> $FORGEJO_OUTPUT
          else
            # Calculate a stable bump, or advance the current next prerelease.
            CURRENT_BASE="${CURRENT_NPM_VERSION%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_BASE"

            case "$BUMP" in
              major)
                BASE_VERSION="$((MAJOR + 1)).0.0"
                ;;
              minor)
                BASE_VERSION="$MAJOR.$((MINOR + 1)).0"
                ;;
              patch)
                BASE_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
                ;;
            esac

            if [ "$IS_PRERELEASE" = "true" ] && echo "$CURRENT_NPM_VERSION" | grep -q -- '-next\.[0-9][0-9]*$'; then
              PRERELEASE_NUMBER="${CURRENT_NPM_VERSION##*-next.}"
              NEW_VERSION="${CURRENT_BASE}-next.$((PRERELEASE_NUMBER + 1))"
            elif [ "$IS_PRERELEASE" = "true" ]; then
              NEW_VERSION="$BASE_VERSION-next.0"
            else
              NEW_VERSION="$BASE_VERSION"
            fi

            echo "new_version=$NEW_VERSION" >> $FORGEJO_OUTPUT
            echo "should_release=true" >> $FORGEJO_OUTPUT
            echo "Calculated new version: $NEW_VERSION ($BUMP bump, channel=$RELEASE_CHANNEL)"
          fi

      - name: Check if version already published
        id: check_published
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          # Check if this version exists in CH5 Verdaccio.
          if npx -y "npm@${NPM_VERSION}" view "@chriscode/hush@$NEW_VERSION" version --registry="${NPM_REGISTRY_URL}" >/dev/null 2>&1; then
            echo "Version $NEW_VERSION already published, skipping"
            echo "already_published=true" >> $FORGEJO_OUTPUT
          else
            echo "Version $NEW_VERSION not yet published"
            echo "already_published=false" >> $FORGEJO_OUTPUT
          fi

      - name: Configure npm publish auth
        id: npm_auth
        if: steps.version.outputs.should_release == 'true' && steps.check_published.outputs.already_published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The committed repo .npmrc resolves //npm.ch5.me/:_authToken from ${NPM_TOKEN}.
          # A project .npmrc overrides $HOME/.npmrc, so without this the repo file expanded
          # ${NPM_TOKEN} to EMPTY and silently beat the credential this job had just written --
          # npm then reported ENEEDAUTH while the secret was present and correct.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # This job only runs on a main / prerelease-next push (see the job-level `if`), so
          # there is no fork or PR case where a missing publish credential is benign. Both
          # checks below used to emit ::warning:: and exit 0, which let the job report
          # SUCCESS while publishing nothing: 25 commits and a whole major bump piled up
          # behind a green pipeline, and the released CLI silently stayed on 7.7.0. A
          # release that cannot publish is a failure, so say so.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not available to Forgejo Actions; cannot publish @chriscode/hush."
            exit 1
          fi

          printf '%s\n' "//${NPM_REGISTRY_HOST}/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          printf '%s\n' "@chriscode:registry=${NPM_REGISTRY_URL}" >> "$HOME/.npmrc"
          printf '%s\n' "registry=${NPM_REGISTRY_URL}" >> "$HOME/.npmrc"

          # Show what actually failed. This check used to send both streams to
          # /dev/null and report EVERY failure as "token rejected", so a network
          # blip, a registry outage, or npx failing to fetch npm itself all
          # produced a confident, wrong diagnosis pointing at the credential --
          # and the credential was then rotated in response to an error it never
          # caused. Capture the output and print it, and only call it a rejection
          # when the registry actually said 401/403.
          # `|| true` is load-bearing: the shell runs with `set -e`, so a bare
          # assignment from a failing command aborts the step instantly and the
          # diagnostics below never print (observed on run 59: the step exited 1
          # with no output at all, which is strictly worse than the wrong
          # diagnosis it replaced). Capture the status separately instead.
          WHOAMI_RC=0
          WHOAMI_OUT=$(npx -y "npm@${NPM_VERSION}" whoami --registry="${NPM_REGISTRY_URL}" 2>&1) || WHOAMI_RC=$?

          if [ "$WHOAMI_RC" -ne 0 ]; then
            echo "npm whoami failed (exit $WHOAMI_RC) against ${NPM_REGISTRY_URL}. Output:"
            printf '%s\n' "$WHOAMI_OUT"
            if printf '%s' "$WHOAMI_OUT" | grep -q 'ENEEDAUTH'; then
              # ENEEDAUTH means NO credential reached npm, which is the opposite of a
              # rejected one. Lumping it in with 401/403 cost hours on 2026-07-25: the
              # Hush token authenticated fine by hand, so "rejected" sent everyone off
              # rotating a healthy credential when the Actions secret was simply not
              # reaching the job. Name the two failures separately.
              echo "::error::No npm credential reached this job (ENEEDAUTH) at ${NPM_REGISTRY_URL}. The token is not rejected -- it is ABSENT. Check that the NPM_TOKEN Actions secret is set and visible to this repo (a repo-level secret overrides the org-level one); do NOT rotate the credential first."
            elif printf '%s' "$WHOAMI_OUT" | grep -qE 'E401|E403|Unauthorized|Forbidden'; then
              echo "::error::NPM_TOKEN was rejected by CH5 Verdaccio at ${NPM_REGISTRY_URL} (see output above); cannot publish."
            else
              echo "::error::Could not verify npm auth against ${NPM_REGISTRY_URL} (see output above). This is NOT necessarily a bad token -- check registry reachability before rotating the credential."
            fi
            exit 1
          fi

          echo "npm auth OK against ${NPM_REGISTRY_URL} as: ${WHOAMI_OUT}"

          echo "can_publish=true" >> "$FORGEJO_OUTPUT"

      - name: Update package.json version
        if: steps.version.outputs.should_release == 'true' && steps.check_published.outputs.already_published == 'false' && steps.npm_auth.outputs.can_publish == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          CURRENT_VERSION=$(node -p "require('./hush-cli/package.json').version")

          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
            echo "package.json already at version $NEW_VERSION"
          else
            cd hush-cli
            # Use npm pkg set instead of npm version to avoid git hooks/issues
            npx -y "npm@${NPM_VERSION}" pkg set version="$NEW_VERSION"
            echo "Updated package.json to version $NEW_VERSION"
          fi

      - name: Publish to npm
        if: steps.version.outputs.should_release == 'true' && steps.check_published.outputs.already_published == 'false' && steps.npm_auth.outputs.can_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The committed repo .npmrc resolves //npm.ch5.me/:_authToken from ${NPM_TOKEN}.
          # A project .npmrc overrides $HOME/.npmrc, so without this the repo file expanded
          # ${NPM_TOKEN} to EMPTY and silently beat the credential this job had just written --
          # npm then reported ENEEDAUTH while the secret was present and correct.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
            npx -y "npm@${NPM_VERSION}" publish --registry="${NPM_REGISTRY_URL}" --tag "${{ steps.version.outputs.release_channel }}" --access public
          else
            npx -y "npm@${NPM_VERSION}" publish --registry="${NPM_REGISTRY_URL}" --access public
          fi
        working-directory: hush-cli

      - name: Create git tag
        if: steps.version.outputs.should_release == 'true' && steps.check_published.outputs.already_published == 'false' && steps.npm_auth.outputs.can_publish == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          TAG="v$NEW_VERSION"

          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@git.ch5.me"

          # Commit the version bump if there are changes
          git add hush-cli/package.json
          git commit -m "chore(release): $NEW_VERSION [skip ci]" || echo "No changes to commit"

          # Create tag
          git tag "$TAG" || echo "Tag already exists"

          # Push commit and tag separately to ensure tag is pushed
          git push origin "HEAD:${{ steps.version.outputs.release_branch }}"
          git push origin "$TAG"

          echo "Created and pushed tag $TAG"

      - name: Create Forgejo Release
        if: steps.version.outputs.should_release == 'true' && steps.check_published.outputs.already_published == 'false' && steps.npm_auth.outputs.can_publish == 'true'
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          TAG="v$NEW_VERSION"

          # Generate release notes from commits
          LAST_TAG="v${{ steps.version.outputs.current_npm_version }}"

          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            NOTES=$(git log "$LAST_TAG"..HEAD~1 --pretty=format:"- %s" 2>/dev/null || echo "- Initial release")
          else
            NOTES="- Initial release"
          fi

          PRERELEASE=false
          if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE=true
          fi

          TAG="$TAG" NOTES="$NOTES" PRERELEASE="$PRERELEASE" RELEASE_BRANCH="${{ steps.version.outputs.release_branch }}" node <<'NODE'
          const fs = require('node:fs');

          fs.writeFileSync('/tmp/forgejo-release.json', JSON.stringify({
            tag_name: process.env.TAG,
            target_commitish: process.env.RELEASE_BRANCH,
            name: process.env.TAG,
            body: process.env.NOTES || '- Initial release',
            draft: false,
            prerelease: process.env.PRERELEASE === 'true',
          }));
          NODE

          curl -fsS \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @/tmp/forgejo-release.json \
            "${FORGEJO_SERVER_URL%/}/api/v1/repos/${FORGEJO_REPOSITORY}/releases" \
            > /tmp/forgejo-release-response.json

      # Verify on the consuming surface: a green release job must mean an installable
      # version, not merely that no step errored. Every gate above can decline to publish,
      # and for 25 commits the job stayed green while the registry stayed on 7.7.0. If this
      # run decided to release, the version has to be resolvable now or the job fails.
      - name: Verify the release is installable
        if: steps.version.outputs.should_release == 'true' && steps.check_published.outputs.already_published == 'false'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          if ! SERVED=$(npx -y "npm@${NPM_VERSION}" view "@chriscode/hush@${NEW_VERSION}" version --registry="${NPM_REGISTRY_URL}" 2>&1); then
            echo "::error::release reported success but @chriscode/hush@${NEW_VERSION} is not resolvable from ${NPM_REGISTRY_URL}."
            echo "$SERVED"
            exit 1
          fi
          echo "published and resolvable: @chriscode/hush@${SERVED}"

  binaries:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: v${{ needs.release.outputs.new_version }}

      - name: Install Node 24
        run: |
          npm install -g "n@${N_VERSION}"
          n "${NODE_VERSION}"
          echo "/usr/local/bin" >> $FORGEJO_PATH

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $FORGEJO_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run cli:build

      - name: Compile single-file binaries
        working-directory: hush-cli
        run: |
          VERSION="${{ needs.release.outputs.new_version }}"
          mkdir -p dist-bin
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build ./bin/hush.js --compile --target="bun-${target}" \
              --define "HUSH_EMBEDDED_VERSION=\"${VERSION}\"" \
              --outfile "dist-bin/hush-${target}"
          done
          bun build ./bin/hush.js --compile --target=bun-windows-x64 \
            --define "HUSH_EMBEDDED_VERSION=\"${VERSION}\"" \
            --outfile dist-bin/hush-windows-x64.exe
          cd dist-bin && sha256sum hush-* > SHA256SUMS && cat SHA256SUMS

      - name: Smoke-test linux binary
        working-directory: hush-cli
        run: |
          ./dist-bin/hush-linux-x64 --version
          test "$(./dist-bin/hush-linux-x64 --version)" = "${{ needs.release.outputs.new_version }}"

      - name: Upload binaries to release
        working-directory: hush-cli
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          TAG="v${{ needs.release.outputs.new_version }}"
          RELEASE_JSON=$(curl -fsS \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${FORGEJO_SERVER_URL%/}/api/v1/repos/${FORGEJO_REPOSITORY}/releases/tags/${TAG}")
          RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -r '.id')

          for asset in dist-bin/hush-* dist-bin/SHA256SUMS; do
            name=$(basename "$asset")
            curl -fsS \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${asset}" \
              "${FORGEJO_SERVER_URL%/}/api/v1/repos/${FORGEJO_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              > /tmp/forgejo-release-asset.json
          done

  deploy-docs:
    needs: ci
    if: forgejo.ref == 'refs/heads/main' && forgejo.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node 24
        run: |
          npm install -g "n@${N_VERSION}"
          n "${NODE_VERSION}"
          echo "/usr/local/bin" >> $FORGEJO_PATH

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> $FORGEJO_PATH

      - name: Install sops and age
        run: |
          run_root() {
            if command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              "$@"
            fi
          }

          curl -LO https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64
          echo "$SOPS_SHA256  sops-v3.11.0.linux.amd64" | sha256sum -c -
          run_root mv sops-v3.11.0.linux.amd64 /usr/local/bin/sops
          run_root chmod +x /usr/local/bin/sops

          curl -LO https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz
          echo "$AGE_SHA256  age-v1.2.0-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf age-v1.2.0-linux-amd64.tar.gz
          run_root mv age/age /usr/local/bin/
          run_root mv age/age-keygen /usr/local/bin/
          run_root chmod +x /usr/local/bin/age /usr/local/bin/age-keygen

      - name: Setup age key
        id: age_key
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -z "${SOPS_AGE_KEY:-}" ]; then
            echo "::warning::SOPS_AGE_KEY is not configured in Forgejo Actions; skipping docs deploy because Hush cannot decrypt the Cloudflare target."
            echo "available=false" >> "$FORGEJO_OUTPUT"
            exit 0
          fi

          mkdir -p ~/.config/sops/age
          printf '%s\n' "$SOPS_AGE_KEY" > ~/.config/sops/age/key.txt
          chmod 600 ~/.config/sops/age/key.txt

      - name: Install dependencies
        if: steps.age_key.outputs.available != 'false'
        run: bun install --frozen-lockfile

      - name: Build CLI and docs
        if: steps.age_key.outputs.available != 'false'
        run: bun run build

      - name: Deploy docs with Hush secrets
        if: steps.age_key.outputs.available != 'false'
        working-directory: docs
        run: |
          export SOPS_AGE_KEY_FILE=~/.config/sops/age/key.txt
          node ../hush-cli/bin/hush.js config active-identity owner-local
          node ../hush-cli/bin/hush.js run --target root-production -- bun run wrangler pages deploy ./dist --project-name=hush-docs
