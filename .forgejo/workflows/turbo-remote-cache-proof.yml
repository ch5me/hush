name: turbo-remote-cache-proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["turbo.json", ".turbo/config.json", "package.json", "bun.lock", "hush-cli/**", "docs/**"]

env:
  TURBO_API: https://turbo.ch5.me
  TURBO_TEAM: ch5
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://bun.sh/install | bash
      - run: export PATH="$HOME/.bun/bin:$PATH"; bun install --frozen-lockfile
      - run: export PATH="$HOME/.bun/bin:$PATH"; bun turbo run build --filter=@chriscode/hush --cache=remote:rw
      - run: find . -type d -name .turbo -prune -exec rm -rf {} +; rm -rf hush-cli/dist
      - run: export PATH="$HOME/.bun/bin:$PATH"; bun turbo run build --filter=@chriscode/hush --cache=remote:r
